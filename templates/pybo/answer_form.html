{% extends 'base.html' %}
{% block content %}

<!-- 답변 수정 페이지 -->
<div class="container my-3">

    <!-- 폼 제출을 위한 POST 요청 처리와 파일 업로드를 위한 enctype 설정 -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- 폼 에러 메시지 표시 -->
        {% include "form_errors.html" %}

        <!-- 폼 필드 전체 출력 (필요시 개별 필드를 출력해도 됩니다) -->
        {{ form.as_p }}

        <!-- 답변 내용 입력 필드 -->
        <div class="mb-3">
            <label for="content" class="form-label">답변내용</label>
            <textarea class="form-control" name="content" id="content" rows="10">
                {{ form.content.value|default_if_none:'' }}  <!-- 기존 값이 없을 때 공백을 표시 -->
            </textarea>
        </div>

        <!-- 저장하기 버튼 -->
        <button type="submit" class="btn btn-primary">저장하기</button>
    </form>
</div>

{% endblock %}
